[project]
name = "postgresql_ext"
description = "Extended PostgreSQL provider for pygeoapi"
version = "0.4.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygeoapi>=0.22.0",
    "SQLAlchemy>2.0",
    "geoalchemy2",
    "pygeofilter",
    "cachetools"
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
license-files = []

[tool.pytest.ini_options]
testpaths = ["tests"]
